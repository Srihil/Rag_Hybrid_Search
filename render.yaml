services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: rag-hybrid-backend
    runtime: python
    pythonVersion: "3.11.9"      # pin 3.11 — all wheels exist; 3.14 has none
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      # PostgreSQL — Neon.tech free tier: https://neon.tech
      - key: DATABASE_URL
        sync: false

      # Qdrant Cloud — free tier: https://cloud.qdrant.io
      - key: QDRANT_MODE
        value: remote
      - key: QDRANT_HOST
        sync: false
      - key: QDRANT_PORT
        value: "6333"
      - key: QDRANT_API_KEY
        sync: false

      # LLM — OpenRouter free models (Ollama not available on Render)
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_MODEL
        value: meta-llama/llama-3.1-8b-instruct:free

      # Embedding & reranking models (downloaded on first use, cached)
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: RERANKER_MODEL
        value: Xenova/ms-marco-MiniLM-L-6-v2

      # Ephemeral storage (fine for demo; uploads reset on redeploy)
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: BM25_INDEX_PATH
        value: /tmp/bm25_index/corpus.pkl
      - key: QDRANT_LOCAL_PATH
        value: /tmp/qdrant_data

      # Retrieval settings
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "200"
      - key: RETRIEVAL_TOP_K
        value: "20"
      - key: RERANK_TOP_K
        value: "5"
      - key: LOG_LEVEL
        value: INFO

  # ── Frontend Static Site ─────────────────────────────────────────────────────
  - type: web
    name: rag-hybrid-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://rag-hybrid-backend-a7go.onrender.com
